AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Creates a PostHog schema property group. Requires the
  PostHog::ProductAnalytics::SchemaPropertyGroup type to be registered and
  configured with SetTypeConfiguration (ApiKey).

Parameters:
  ProjectId:
    Type: String
    Description: PostHog project ID.

Resources:
  Checkout:
    Type: PostHog::ProductAnalytics::SchemaPropertyGroup
    Properties:
      ProjectId: !Ref ProjectId
      Name: Checkout
      Description: Properties every checkout event carries
      Properties:
        - Name: plan
          PropertyType: String
          IsRequired: true
          Description: Billing plan
        - Name: amount
          PropertyType: Numeric
          IsRequired: true
        - Name: coupon
          PropertyType: String

Outputs:
  PropertyGroupId:
    Value: !GetAtt Checkout.Id
