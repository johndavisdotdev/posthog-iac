AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Creates a PostHog project secret API key and stores its value in Secrets
  Manager. Requires the PostHog::Projects::SecretApiKey type to be registered
  and configured with SetTypeConfiguration (ApiKey). The type's execution role
  needs secretsmanager:PutSecretValue on the secret.

Parameters:
  ProjectId:
    Type: String
    Description: PostHog project ID.

Resources:
  KeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: posthog/backend-secret-api-key
      Description: PostHog project secret API key (written by PostHog::Projects::SecretApiKey)

  BackendKey:
    Type: PostHog::Projects::SecretApiKey
    Properties:
      ProjectId: !Ref ProjectId
      Label: backend
      Scopes:
        - feature_flag:read
        - query:read
      SecretsManagerSecretArn: !Ref KeySecret

Outputs:
  SecretApiKeyId:
    Value: !GetAtt BackendKey.Id
  MaskValue:
    Value: !GetAtt BackendKey.MaskValue
  SecretArn:
    Description: Read the key value from here, e.g. {{resolve:secretsmanager:posthog/backend-secret-api-key}}.
    Value: !Ref KeySecret
