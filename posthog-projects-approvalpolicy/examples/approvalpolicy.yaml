AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Requires approval for feature flag changes in a PostHog project. Requires the
  PostHog::Projects::ApprovalPolicy type to be registered and configured with
  SetTypeConfiguration (ApiKey).

Parameters:
  ProjectId:
    Type: String
    Description: PostHog project ID.
  ApproverUserId:
    Type: Number
    Description: PostHog user ID of the approver.

Resources:
  FlagChangesNeedApproval:
    Type: PostHog::Projects::ApprovalPolicy
    Properties:
      ProjectId: !Ref ProjectId
      ActionKey: feature_flag.update
      ApproverConfig:
        Fn::ToJsonString:
          users:
            - !Ref ApproverUserId
          quorum: 1
      AllowSelfApprove: false
      ExpiresAfter: "7 00:00:00"
      Enabled: true

Outputs:
  ApprovalPolicyId:
    Value: !GetAtt FlagChangesNeedApproval.Id
